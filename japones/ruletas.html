<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruletas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7ECD7; --surface:#FFF8EA; --input:#FFFDF6; --text:#472C1A; --muted:#8B6A52;
  --line:#E5D0AE; --brown:#7A4527; --on-brown:#FFF3DF; --peach:#F7AC84; --on-peach:#472C1A;
  --pointer:#7A4527; --hub:#FFF8EA; --rim:#7A4527;
  --w1:#F6E3C0; --w2:#F9B58C; --w3:#8A5733; --w4:#FBD5AE; --w5:#C98657; --w6:#EBCF9F;
  --serif:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif; --sans:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A120D; --surface:#271B14; --input:#1F1510; --text:#F5E7D1; --muted:#BBA48C;
    --line:#41301F; --brown:#E0AE86; --on-brown:#1A120D; --peach:#E98C5E; --on-peach:#1A120D;
    --pointer:#F0A878; --hub:#271B14; --rim:#E0AE86;
    --w1:#4F3626; --w2:#B7653B; --w3:#2E2018; --w4:#7A4C31; --w5:#D58C5F; --w6:#3F2B1E;
  }
}
:root[data-theme="dark"]{
  --bg:#1A120D; --surface:#271B14; --input:#1F1510; --text:#F5E7D1; --muted:#BBA48C;
  --line:#41301F; --brown:#E0AE86; --on-brown:#1A120D; --peach:#E98C5E; --on-peach:#1A120D;
  --pointer:#F0A878; --hub:#271B14; --rim:#E0AE86;
  --w1:#4F3626; --w2:#B7653B; --w3:#2E2018; --w4:#7A4C31; --w5:#D58C5F; --w6:#3F2B1E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;margin-bottom:24px}
h1{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.6rem);margin:0;line-height:1.1;letter-spacing:-.01em}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;gap:10px}
.seg span{font-weight:600;font-size:.95rem;color:var(--muted)}
.seg button{width:36px;height:36px;padding:0;border-radius:50%;border:2px solid var(--brown);background:transparent;color:var(--text);font:700 1rem var(--sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brown);color:var(--on-brown)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
.btn{border:0;border-radius:12px;font:700 1rem var(--sans);padding:12px 22px;cursor:pointer;background:var(--brown);color:var(--on-brown)}
.btn.peach{background:var(--peach);color:var(--on-peach)}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);padding:8px 14px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.grid.one{max-width:560px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card[hidden]{display:none}
.card h2{font-family:var(--serif);font-size:1.3rem;margin:0}
.stage{position:relative;width:100%;max-width:400px;margin:0 auto}
canvas{display:block;width:100%;aspect-ratio:1;height:auto}
.pointer{position:absolute;left:50%;top:-4px;width:0;height:0;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--pointer);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.res{min-height:110px;border:2px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:var(--input)}
.res .hint{margin:0;color:var(--muted)}
.res h3{font-family:var(--serif);font-size:1.6rem;margin:0;line-height:1.15;overflow-wrap:anywhere}
.res .ctx{margin:0;padding:10px 12px;border-radius:10px;background:var(--peach);color:var(--on-peach);font-weight:600;animation:rev .5s ease both}
@keyframes rev{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.res .ctx{animation:none}}
label{font-weight:700;font-size:.95rem}
textarea{width:100%;min-height:150px;resize:vertical;border:2px solid var(--line);border-radius:12px;background:var(--input);color:var(--text);font:400 1rem/1.5 var(--sans);padding:12px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.all{display:flex;justify-content:center;margin-top:22px}
.all[hidden]{display:none}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:.9rem;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--brown);cursor:pointer}
.tog{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font:600 .9rem var(--sans);padding:4px 2px;margin-bottom:6px;cursor:pointer}
.tog:hover{color:var(--text)}
.chev{transition:transform .2s}
.tog[aria-expanded="false"] .chev{transform:rotate(-90deg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Seleccionador de Ruletas</h1>
    <div class="tools">
      <div class="seg" role="group" aria-label="Número de ruletas">
        <span>Ruletas</span>
        <button type="button" data-n="1" aria-pressed="true" aria-label="1 ruleta">1</button>
        <button type="button" data-n="2" aria-pressed="false" aria-label="2 ruletas">2</button>
      </div>
      <button type="button" class="btn ghost" id="snd" aria-pressed="true">Sonido activado</button>
      <button type="button" class="btn ghost" id="theme" aria-label="Cambiar entre modo claro y oscuro">Modo oscuro</button>
    </div>
  </header>
  <main class="grid one" id="grid"></main>
  <div class="all" id="all" hidden><button type="button" class="btn peach" id="spinAll">Girar las dos ruletas</button></div>
</div>

<script>
const KEY = 'ruletas-v1';
const DEF = [
  'Fotosíntesis | Las plantas convierten luz solar en energía química\nMitosis | División celular que produce dos células idénticas\nGravedad | Fuerza que atrae los cuerpos con masa\nEcosistema | Comunidad de seres vivos y su entorno\nEnergía | Capacidad de realizar trabajo',
  'Ana\nLuis\nSofía | Le toca presentar primero\nCarlos\nValentina | Elige el tema de la próxima clase'
];
let st = { count: 1, theme: null, texts: DEF.slice() };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') st = Object.assign(st, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

const root = document.documentElement;
if (st.theme === 'dark' || st.theme === 'light') root.setAttribute('data-theme', st.theme);
const dark = () => (root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
const themeBtn = document.getElementById('theme');
function syncTheme() { themeBtn.textContent = dark() ? 'Modo claro' : 'Modo oscuro'; }

function parse(t) {
  return t.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 40).map(l => {
    const i = l.indexOf('|');
    return i < 0 ? { w: l, c: '' } : { w: l.slice(0, i).trim(), c: l.slice(i + 1).trim() };
  }).filter(x => x.w);
}
function lum(hex) {
  const h = hex.replace('#', ''); const v = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255)
    .map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2];
}

const grid = document.getElementById('grid');
const wheels = [0, 1].map(idx => {
  const el = document.createElement('section');
  el.className = 'card'; if (idx === 1) el.hidden = true;
  el.innerHTML = `
    <h2>Ruleta ${idx + 1}</h2>
    <div class="stage"><div class="pointer"></div><canvas aria-label="Ruleta ${idx + 1}"></canvas></div>
    <div class="row"><button type="button" class="btn spin">Girar</button><label class="chk"><input type="checkbox" class="rm"> Eliminar la franja al salir</label></div>
    <div class="res" aria-live="polite"><p class="hint">Gira la ruleta para ver el resultado.</p></div>
    <div>
      <button type="button" class="tog" aria-expanded="true" aria-controls="box${idx}"><svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ocultar contenido</span></button>
      <div class="box" id="box${idx}">
      <label for="ta${idx}">Contenido de las franjas</label>
      <textarea id="ta${idx}" spellcheck="false" placeholder="Una franja por línea.&#10;Añade contexto oculto con una barra vertical:&#10;Palabra | Contexto que aparece al caer"></textarea>
      <div class="meta"><span>Una franja por línea. Usa | para añadir contexto.</span><span class="count"></span></div>
      </div>
    </div>`;
  grid.appendChild(el);
  const w = { idx, el, canvas: el.querySelector('canvas'), ta: el.querySelector('textarea'), res: el.querySelector('.res'),
    btn: el.querySelector('.spin'), cnt: el.querySelector('.count'), items: [], angle: 0, spinning: false };
  w.ta.value = st.texts[idx] != null ? st.texts[idx] : DEF[idx];
  w.items = parse(w.ta.value); w.cnt.textContent = w.items.length + ' franjas';
  w.ta.addEventListener('input', () => {
    st.texts[idx] = w.ta.value; save(); w.items = parse(w.ta.value);
    w.cnt.textContent = w.items.length + (w.items.length === 1 ? ' franja' : ' franjas');
    hint(w, 'Gira la ruleta para ver el resultado.'); draw(w);
  });
  w.btn.addEventListener('click', () => spin(w));
  w.rm = el.querySelector('.rm'); w.rm.checked = !!(st.remove && st.remove[idx]);
  w.rm.addEventListener('change', () => { if (!Array.isArray(st.remove)) st.remove = [false, false]; st.remove[idx] = w.rm.checked; save(); });
  const tog = el.querySelector('.tog'), box = el.querySelector('.box');
  tog.addEventListener('click', () => {
    const open = tog.getAttribute('aria-expanded') === 'true';
    tog.setAttribute('aria-expanded', String(!open)); box.hidden = open;
    tog.querySelector('span').textContent = open ? 'Mostrar contenido' : 'Ocultar contenido';
  });
  return w;
});

function hint(w, t) { w.res.innerHTML = ''; const p = document.createElement('p'); p.className = 'hint'; p.textContent = t; w.res.appendChild(p); }

function draw(w) {
  const c = w.canvas, S = c.clientWidth; if (!S) return;
  const d = window.devicePixelRatio || 1;
  if (c.width !== Math.round(S * d)) { c.width = c.height = Math.round(S * d); }
  const ctx = c.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, S, S);
  const cs = getComputedStyle(root), g = k => cs.getPropertyValue(k).trim();
  const pal = [1, 2, 3, 4, 5, 6].map(i => g('--w' + i));
  const cx = S / 2, R = S / 2 - 8, n = w.items.length, sl = 2 * Math.PI / Math.max(n, 1);
  ctx.save(); ctx.translate(cx, cx); ctx.rotate(w.angle);
  if (n === 0) { ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fillStyle = pal[0]; ctx.fill(); }
  for (let i = 0; i < n; i++) {
    let col = pal[i % pal.length]; if (n > 1 && i === n - 1 && i % pal.length === 0) col = pal[2];
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, i * sl, (i + 1) * sl); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = g('--surface'); ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.rotate((i + .5) * sl); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = lum(col) > .32 ? '#3A2314' : '#FFF3DF';
    let size = Math.min(20, Math.max(10, R * sl * .42)), label = w.items[i].w, maxW = R - 46;
    ctx.font = `700 ${size}px ${g('--sans')}`;
    while (ctx.measureText(label).width > maxW && size > 10) { size--; ctx.font = `700 ${size}px ${g('--sans')}`; }
    while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0, -2) + '…';
    ctx.fillText(label, R - 16, 0); ctx.restore();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cx, R, 0, 7); ctx.strokeStyle = g('--rim'); ctx.lineWidth = 5; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cx, 20, 0, 7); ctx.fillStyle = g('--hub'); ctx.fill(); ctx.strokeStyle = g('--rim'); ctx.lineWidth = 4; ctx.stroke();
}

let AC = null, soundOn = st.sound !== false;
function ac() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {}
  return AC;
}
function tone(f, t0, dur, vol, type) {
  const a = ac(); if (!a || !soundOn) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function tick() { const a = ac(); if (a) tone(880 + Math.random() * 90, a.currentTime, .05, .08, 'triangle'); }
function chime() { const a = ac(); if (!a) return; const t = a.currentTime; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * .11, .55, .14, 'sine')); }

function busy() {
  const b = wheels.some(w => w.spinning);
  wheels.forEach(w => w.btn.disabled = b); document.getElementById('spinAll').disabled = b;
}

function show(w, it) {
  w.res.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = it.w; w.res.appendChild(h);
  if (it.c) { const p = document.createElement('p'); p.className = 'ctx'; p.textContent = it.c; w.res.appendChild(p); }
}

function spin(w) {
  return new Promise(done => {
    if (w.spinning) return done();
    if (w.items.length < 2) { hint(w, 'Añade al menos dos franjas para girar.'); return done(); }
    w.spinning = true; ac(); busy(); hint(w, 'Girando…');
    const n = w.items.length, sl = 2 * Math.PI / n, TAU = 2 * Math.PI, win = Math.floor(Math.random() * n);
    const jitter = (Math.random() - .5) * sl * .7;
    const target = -Math.PI / 2 - (win + .5) * sl - jitter, start = w.angle;
    const delta = (((target - start) % TAU) + TAU) % TAU + TAU * (5 + Math.floor(Math.random() * 3));
    const dur = (matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 4200) + Math.random() * 1000;
    const t0 = performance.now(); let last = -1, lt = 0;
    (function f(t) {
      const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 4);
      w.angle = start + delta * e; draw(w);
      const k = Math.floor(((((-Math.PI / 2 - w.angle) % TAU) + TAU) % TAU) / sl);
      if (k !== last) { last = k; if (p < 1 && t - lt > 40) { lt = t; tick(); } }
      if (p < 1) requestAnimationFrame(f);
      else {
        show(w, w.items[win]); chime();
        if (w.rm.checked) {
          setTimeout(() => {
            w.items.splice(win, 1);
            w.ta.value = w.items.map(x => x.c ? x.w + ' | ' + x.c : x.w).join('\n');
            st.texts[w.idx] = w.ta.value; save();
            w.cnt.textContent = w.items.length + (w.items.length === 1 ? ' franja' : ' franjas');
            w.spinning = false; busy(); draw(w); done();
          }, 1300);
        } else { w.spinning = false; busy(); done(); }
      }
    })(t0);
  });
}

function setCount(n) {
  st.count = n; save();
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === n)));
  wheels[1].el.hidden = n < 2; grid.classList.toggle('one', n === 1);
  document.getElementById('all').hidden = n < 2;
  wheels.forEach(draw);
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setCount(+b.dataset.n)));
document.getElementById('spinAll').addEventListener('click', () => { spin(wheels[0]); spin(wheels[1]); });
themeBtn.addEventListener('click', () => {
  st.theme = dark() ? 'light' : 'dark'; root.setAttribute('data-theme', st.theme); save(); syncTheme(); wheels.forEach(draw);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { syncTheme(); wheels.forEach(draw); });
addEventListener('resize', () => wheels.forEach(draw));
const sndBtn = document.getElementById('snd');
function syncSnd() { sndBtn.textContent = soundOn ? 'Sonido activado' : 'Sonido apagado'; sndBtn.setAttribute('aria-pressed', String(soundOn)); }
sndBtn.addEventListener('click', () => { soundOn = !soundOn; st.sound = soundOn; save(); syncSnd(); if (soundOn) tick(); });
syncSnd(); syncTheme(); setCount(st.count === 2 ? 2 : 1);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('700 16px "M PLUS Rounded 1c"'), document.fonts.ready]).then(() => wheels.forEach(draw)).catch(() => {});
}
</script>
</body>
</html>
